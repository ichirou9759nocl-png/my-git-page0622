<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODOリスト</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 24px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .input-row input {
      flex: 1;
      padding: 12px 16px;
      font-size: 1rem;
      border: 2px solid #dde1e9;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s;
      background: #fff;
    }

    .input-row input:focus {
      border-color: #4f6ef7;
    }

    .input-row button {
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      background: #4f6ef7;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .input-row button:hover { background: #3a57d4; }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .filters button {
      padding: 6px 14px;
      font-size: 0.875rem;
      border: 2px solid #dde1e9;
      border-radius: 20px;
      background: #fff;
      cursor: pointer;
      color: #555;
      transition: all 0.2s;
    }

    .filters button.active {
      background: #4f6ef7;
      border-color: #4f6ef7;
      color: #fff;
    }

    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border-radius: 10px;
      padding: 14px 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      animation: fadeIn 0.18s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .todo-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #4f6ef7;
      cursor: pointer;
      flex-shrink: 0;
    }

    .todo-item span {
      flex: 1;
      font-size: 1rem;
      color: #1a1a2e;
      word-break: break-word;
      transition: color 0.2s;
    }

    .todo-item.done span {
      text-decoration: line-through;
      color: #aaa;
    }

    .todo-item .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #ccc;
      font-size: 1.2rem;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.2s;
      flex-shrink: 0;
    }

    .todo-item .delete-btn:hover { color: #e05555; }

    .empty {
      text-align: center;
      color: #aaa;
      padding: 40px 0;
      font-size: 0.95rem;
    }

    .footer {
      margin-top: 20px;
      font-size: 0.82rem;
      color: #aaa;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer button {
      background: none;
      border: none;
      cursor: pointer;
      color: #bbb;
      font-size: 0.82rem;
      text-decoration: underline;
    }

    .footer button:hover { color: #e05555; }
  </style>
</head>
<body>
<div class="container">
  <h1>TODOリスト</h1>

  <div class="input-row">
    <input type="text" id="new-todo" placeholder="新しいタスクを入力..." maxlength="200">
    <button onclick="addTodo()">追加</button>
  </div>

  <div class="filters">
    <button class="active" onclick="setFilter('all', this)">すべて</button>
    <button onclick="setFilter('active', this)">未完了</button>
    <button onclick="setFilter('done', this)">完了済み</button>
  </div>

  <div class="todo-list" id="todo-list"></div>

  <div class="footer">
    <span id="count"></span>
    <button onclick="clearDone()">完了済みを削除</button>
  </div>
</div>

<script>
  let todos = JSON.parse(localStorage.getItem('todos') || '[]');
  let filter = 'all';

  function save() {
    localStorage.setItem('todos', JSON.stringify(todos));
  }

  function render() {
    const list = document.getElementById('todo-list');
    const visible = todos.filter(t =>
      filter === 'all' ? true : filter === 'done' ? t.done : !t.done
    );

    if (visible.length === 0) {
      list.innerHTML = '<p class="empty">タスクがありません</p>';
    } else {
      list.innerHTML = visible.map(t => `
        <div class="todo-item${t.done ? ' done' : ''}" data-id="${t.id}">
          <input type="checkbox" ${t.done ? 'checked' : ''}
            onchange="toggle(${t.id})">
          <span>${escHtml(t.text)}</span>
          <button class="delete-btn" onclick="remove(${t.id})" title="削除">✕</button>
        </div>
      `).join('');
    }

    const remaining = todos.filter(t => !t.done).length;
    document.getElementById('count').textContent =
      `残り ${remaining} / ${todos.length} 件`;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function addTodo() {
    const input = document.getElementById('new-todo');
    const text = input.value.trim();
    if (!text) return;
    todos.unshift({ id: Date.now(), text, done: false });
    save();
    render();
    input.value = '';
    input.focus();
  }

  function toggle(id) {
    const t = todos.find(t => t.id === id);
    if (t) t.done = !t.done;
    save();
    render();
  }

  function remove(id) {
    todos = todos.filter(t => t.id !== id);
    save();
    render();
  }

  function clearDone() {
    todos = todos.filter(t => !t.done);
    save();
    render();
  }

  function setFilter(f, btn) {
    filter = f;
    document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  document.getElementById('new-todo').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTodo();
  });

  render();
</script>
</body>
</html>
